name: benokee_app
description: Een eenvoudige, betrouwbare check-in tool voor alleenstaanden
publish_to: 'none'
version: 1.1.0+28

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.2
  
  # Email (cross-platform) - simple URL launcher
  url_launcher: ^6.2.5
  
  # Email SMTP (for automatic sending)
  mailer: ^6.0.1
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  
  # QR Code generation
  qr_flutter: ^4.1.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Secure storage for credentials
  flutter_secure_storage: ^9.2.2
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Utilities
  intl: ^0.19.0
  
  # App info (version)
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
